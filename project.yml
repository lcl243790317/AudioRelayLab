name: AudioRelayLab
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  AudioRelayLab:
    type: application
    platform: iOS
    sources:
      - path: AudioRelayLab
        excludes:
          - Assets.xcassets
          - Info.plist
      - path: AudioRelayLab/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audiorelaylab.AudioRelayLab
        PRODUCT_NAME: AudioRelayLab
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: AudioRelayLab/Info.plist
      properties:
        CFBundleDisplayName: 音频接力实验室
        CFBundleName: AudioRelayLab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        LSRequiresIPhoneOS: true
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: 播放和录音模式实验需要配置可使用麦克风的音频会话，本应用不会采集或保存麦克风录音。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
    scheme:
      gatherCoverageData: false
      management:
        shared: true
