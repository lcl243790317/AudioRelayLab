name: AudioRelayLab
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  AudioRelayLab:
    type: application
    platform: iOS
    sources:
      - path: AudioRelayLab
        excludes:
          - Assets.xcassets
          - Info.plist
          - Resources
          - VoiceLab/Vendor
          - VoiceLab/DSP
      - path: AudioRelayLab/VoiceLab/DSP
        compilerFlags: "-O3"
      - path: AudioRelayLab/Resources
        buildPhase: resources
      - path: AudioRelayLab/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audiorelaylab.AudioRelayLab
        PRODUCT_NAME: AudioRelayLab
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '1.4.0'
        CURRENT_PROJECT_VERSION: '7'
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_OBJC_BRIDGING_HEADER: AudioRelayLab/VoiceLab/DSP/AudioRelayLab-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
    info:
      path: AudioRelayLab/Info.plist
      properties:
        CFBundleDisplayName: 音频接力实验室
        CFBundleName: AudioRelayLab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        LSRequiresIPhoneOS: true
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: 使用麦克风录音或实时变声。只有主动点击生成 AI 声音时，所选录音才发送到你配置的电脑。C/D 实验也需要麦克风会话权限。
        NSLocalNetworkUsageDescription: 连接你同一网络的电脑，在本机服务中转换所选人声。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: CallKit.framework
      - sdk: Security.framework
      - sdk: CryptoKit.framework
    scheme:
      testTargets:
        - AudioRelayLabTests
      gatherCoverageData: false
      management:
        shared: true
  AudioRelayLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AudioRelayLabTests
        excludes:
          - Fixtures
      - path: AudioRelayLabTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: AudioRelayLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audiorelaylab.AudioRelayLab.Tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1'
