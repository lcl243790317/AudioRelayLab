name: iOS 无签名构建
on:
  workflow_dispatch:
    inputs:
      diagnosticOnly:
        description: '仅运行所选单项 UI 诊断，不生成 IPA'
        type: boolean
        default: false
      diagnosticScope:
        description: '单项诊断范围'
        type: choice
        options: [automatic, small, single-delete]
        default: automatic
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-${{ github.event.inputs.diagnosticOnly == 'true' && 'diagnostic' || 'build' }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.diagnosticOnly != 'true'
    # Keep the iOS 18 regression baseline on the standard Apple silicon pool.
    runs-on: macos-15
    # Run 32 reached 150 minutes; retain small phase logs before large diagnostics.
    # Per-case XCTest limits and bounded recorder cleanup also constrain the run.
    timeout-minutes: 240
    env:
      AUDIOLAB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      AUDIOLAB_SIMULATOR_OS: '18.5'
    defaults:
      run:
        shell: bash
    steps:
      - name: 读取源码
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.AUDIOLAB_SOURCE_COMMIT }}
      - name: 记录真实构建环境
        run: |
          set -euo pipefail
          mkdir -p build dist
          {
            sw_vers
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            swift --version
            xcode-select -p
            xcrun simctl list runtimes
            printf '源码提交：%s\n' "$(git rev-parse HEAD)"
          } 2>&1 | tee build-environment.log
      - name: 配置 Python 3.12 与 CPU 测试依赖
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 安装锁定的 CPU 测试依赖
        run: python3 -m pip install -r server/ci-requirements.txt 2>&1 | tee build-python-dependencies.log
      - name: 安装 XcodeGen 并静态检查
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version 2>&1 | tee build-xcodegen-version.log
          python3 scripts/static_check.py 2>&1 | tee build-static.log
          python3 -m unittest discover -s tests -v 2>&1 | tee build-tests.log
      - name: 生成 Xcode 工程
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 scripts/generate-audio-fixtures.py 2>&1 | tee build-audio-fixtures.log
          xcodegen generate 2>&1 | tee build-xcodegen.log
          xcodebuild -project AudioRelayLab.xcodeproj -list 2>&1 | tee build-project-list.log
      - name: 编译模拟器
        run: |
          set -euo pipefail
          xcodebuild \
            -project AudioRelayLab.xcodeproj -scheme AudioRelayLab \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            -resultBundlePath build/simulator.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-simulator.log
      - name: 在真实 iPhone Simulator 中运行 XCTest
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > build-simulators.json
          SIMULATOR_UDID="$(python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          devices = json.loads(Path('build-simulators.json').read_text())['devices']
          runtimes = sorted(devices, key=lambda name: tuple(map(int, re.findall(r'\d+', name))), reverse=True)
          for runtime in runtimes:
              if not runtime.endswith('.iOS-'+os.environ['AUDIOLAB_SIMULATOR_OS'].replace('.','-')):
                  continue
              for device in devices[runtime]:
                  if device.get('isAvailable') and device.get('name', '').startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('没有可用的 iPhone Simulator，不能宣称 XCTest 通过。')
          PY
          )"
          SIMULATOR_ARCH="$(uname -m)"
          # Grant only the test app's microphone permission on this disposable simulator.
          if python3 - "$SIMULATOR_UDID" <<'PY'
          import json,sys
          devices=json.load(open('build-simulators.json'))['devices']
          sys.exit(0 if any(d['udid']==sys.argv[1] and d['state']=='Booted' for group in devices.values() for d in group) else 1)
          PY
          then :; else xcrun simctl boot "$SIMULATOR_UDID"; fi
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" build/simulator/Build/Products/Debug-iphonesimulator/AudioRelayLab.app
          xcrun simctl privacy "$SIMULATOR_UDID" grant microphone com.audiorelaylab.AudioRelayLab
          # Native URLSession tests use trusted loopback HTTPS, never the live GPU or production credentials.
          cat > build/revoice-fixture-openssl.cnf <<'CONF'
          [req]
          distinguished_name = subject
          x509_extensions = extensions
          prompt = no
          [subject]
          CN = AudioRelayLab disposable CI fixture
          [extensions]
          basicConstraints = critical,CA:TRUE
          keyUsage = critical,digitalSignature,keyEncipherment,keyCertSign
          extendedKeyUsage = serverAuth
          subjectAltName = @names
          [names]
          IP.1 = 127.0.0.1
          DNS.1 = localhost
          CONF
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -config build/revoice-fixture-openssl.cnf -keyout build/revoice-fixture.key \
            -out build/revoice-fixture.crt 2> build/revoice-fixture-certificate.log
          xcrun simctl keychain "$SIMULATOR_UDID" add-root-cert build/revoice-fixture.crt
          python3 -u scripts/run-revoice-download-fixture.py --certificate build/revoice-fixture.crt \
            --private-key build/revoice-fixture.key --report build/revoice-download-fixture-report.json \
            > build-revoice-network.log 2>&1 &
          DOWNLOAD_FIXTURE_PID=$!
          cleanup_download_fixture() {
            kill -TERM "$DOWNLOAD_FIXTURE_PID" 2>/dev/null || true
            wait "$DOWNLOAD_FIXTURE_PID" || true
          }
          trap cleanup_download_fixture EXIT
          # Cold hosted runners can still be starting Python after the simulator boots.
          # Bound startup separately from tests; never retry certificate/HTTP failures.
          DOWNLOAD_FIXTURE_STARTED=$SECONDS
          DOWNLOAD_FIXTURE_READY=false
          while (( SECONDS - DOWNLOAD_FIXTURE_STARTED < 60 )); do
            if ! kill -0 "$DOWNLOAD_FIXTURE_PID" 2>/dev/null; then
              echo 'Loopback HTTPS fixture exited before readiness.'
              cat build-revoice-network.log
              exit 1
            fi
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 3 \
              --cacert build/revoice-fixture.crt https://127.0.0.1:8765/ready \
              2> build/revoice-fixture-readiness.log; then
              DOWNLOAD_FIXTURE_READY=true
              break
            else
              DOWNLOAD_FIXTURE_CURL_STATUS=$?
            fi
            if [ "$DOWNLOAD_FIXTURE_CURL_STATUS" -ne 7 ] && [ "$DOWNLOAD_FIXTURE_CURL_STATUS" -ne 28 ]; then
              cat build/revoice-fixture-readiness.log build-revoice-network.log
              exit "$DOWNLOAD_FIXTURE_CURL_STATUS"
            fi
            sleep 1
          done
          if [ "$DOWNLOAD_FIXTURE_READY" != true ]; then
            echo 'Loopback HTTPS fixture did not become ready within 60 seconds.'
            cat build/revoice-fixture-readiness.log build-revoice-network.log
            ps -p "$DOWNLOAD_FIXTURE_PID" -o pid=,stat=,etime=,comm= || true
            exit 1
          fi
          printf 'Loopback HTTPS fixture ready after %s seconds.\n' \
            "$(( SECONDS - DOWNLOAD_FIXTURE_STARTED ))" | tee -a build/revoice-fixture-readiness.log
          # Capture real, rendered SwiftUI pages from the installed app, before tests change its library.
          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-audio.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab voice-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-voice.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab voice-custom-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-voice-custom.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab night-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-audio-dark.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab voice-custom-snapshot night-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-voice-custom-dark.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab voice-custom-snapshot voice-large-type day-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-voice-custom-large.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab voice-custom-snapshot voice-large-type night-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-voice-custom-large-dark.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab voice-custom-snapshot voice-recovery-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-voice-recovery.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab mix-snapshot mix-timing-snapshot day-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-mix.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab mix-snapshot mix-timing-snapshot voice-large-type night-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-mix-large-dark.png
          xcrun simctl terminate "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab
          printf 'XCTest iPhone Simulator UDID: %s; architecture: %s\n' "$SIMULATOR_UDID" "$SIMULATOR_ARCH" | tee build-test-destination.log
          xcodebuild \
            -project AudioRelayLab.xcodeproj -scheme AudioRelayLab \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID,arch=$SIMULATOR_ARCH" \
            -destination-timeout 180 -parallel-testing-enabled NO \
            -derivedDataPath build/simulator-tests \
            -resultBundlePath build/unit-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test -only-testing:AudioRelayLabTests 2>&1 | tee build-xctest.log
          cleanup_download_fixture
          trap - EXIT
      - name: 保留 XCTest 阶段日志
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AudioRelayLab-XCTest-Checkpoint
          retention-days: 14
          compression-level: 1
          path: |
            build-environment.log
            build-tests.log
            build-static.log
            build-simulator.log
            build-xctest.log
            build/revoice-download-fixture-report.json
            build/revoice-fixture-readiness.log
      - name: 在 iPhone Simulator 运行完整界面回归并导出截图
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(python3 - <<'PY'
          import re
          from pathlib import Path
          print(re.search(r'UDID: ([0-9A-F-]+)',Path('build-test-destination.log').read_text())[1])
          PY
          )"
          SIMULATOR_ARCH="$(uname -m)"
          python3 scripts/run-recorded-ui-tests.py --simulator "$SIMULATOR_UDID" \
            --video build/ui-interaction.mp4 --recording-log build-ui-recording.log -- xcodebuild \
            -project AudioRelayLab.xcodeproj -scheme AudioRelayLab \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID,arch=$SIMULATOR_ARCH" \
            -destination-timeout 180 -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 1800 \
            -derivedDataPath build/simulator-tests -resultBundlePath build/ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test -only-testing:AudioRelayLabUITests 2>&1 | tee build-uitest.log
      - name: 保留完整 UI 阶段日志
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AudioRelayLab-UI-Logs
          retention-days: 14
          compression-level: 1
          path: |
            build-environment.log
            build-uitest.log
            build-ui-recording.log
      - name: 在小屏 iPhone SE 验证已选音乐的主题与大字体布局
        run: |
          set -euo pipefail
          # Release the regular phone before booting a second simulator on the hosted runner.
          REGULAR_UDID="$(python3 - <<'PY'
          import re
          from pathlib import Path
          print(re.search(r'UDID: ([0-9A-F-]+)',Path('build-test-destination.log').read_text())[1])
          PY
          )"
          xcrun simctl shutdown "$REGULAR_UDID"
          xcrun simctl list runtimes --json > build/small-runtimes.json
          SMALL_RUNTIME="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          runtimes=json.loads(Path('build/small-runtimes.json').read_text())['runtimes']
          available=[r for r in runtimes if r.get('isAvailable') and r.get('name','').startswith('iOS') and r['version']==os.environ['AUDIOLAB_SIMULATOR_OS']]
          if not available: raise SystemExit('Pinned iOS Simulator runtime is unavailable')
          print(max(available,key=lambda r:tuple(map(int,r['version'].split('.'))))['identifier'])
          PY
          )"
          SMALL_UDID="$(xcrun simctl create AudioRelayLab-SmallPhone com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$SMALL_RUNTIME")"
          trap 'xcrun simctl shutdown "$SMALL_UDID" 2>/dev/null || true' EXIT
          printf 'iPhone SE (3rd generation): %s; runtime: %s\n' "$SMALL_UDID" "$SMALL_RUNTIME" > build-small-destination.log
          xcrun simctl boot "$SMALL_UDID"
          xcrun simctl bootstatus "$SMALL_UDID" -b
          xcrun simctl install "$SMALL_UDID" build/simulator/Build/Products/Debug-iphonesimulator/AudioRelayLab.app
          xcodebuild -project AudioRelayLab.xcodeproj -scheme AudioRelayLab \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SMALL_UDID,arch=$(uname -m)" \
            -destination-timeout 180 -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 1800 \
            -derivedDataPath build/simulator-tests -resultBundlePath build/small-ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test-without-building -only-testing:AudioRelayLabUITests/InteractionUITests/testSelectedMusicTimingScreenshotsAcrossThemesAndLargeType \
            2>&1 | tee build-small-uitest.log
          xcrun simctl shutdown "$SMALL_UDID"
          trap - EXIT
      - name: 导出真实 UI 测试截图（包含失败诊断）
        if: always()
        run: |
          set -euo pipefail
          if [ -f build/ui-tests.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/ui-tests.xcresult --output-path build/ui-attachments
          fi
          if [ -f build/small-ui-tests.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/small-ui-tests.xcresult --output-path build/ui-small-attachments
          fi
      - name: 编译 iPhoneOS Release
        run: |
          set -euo pipefail
          xcodebuild \
            -project AudioRelayLab.xcodeproj -scheme AudioRelayLab \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            -resultBundlePath build/device.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-device.log
      - name: 验证真机产物并打包 unsigned IPA
        run: |
          set -euo pipefail
          bash scripts/package-ipa.sh 2>&1 | tee build-package.log
          shasum -a 256 dist/AudioRelayLab-unsigned.ipa | tee dist/SHA256SUMS.txt
      - name: 核对真实构建证据并更新 Artifact 状态报告
        run: |
          set -euo pipefail
          python3 scripts/record-ci-result.py 2>&1 | tee build-evidence.log
      - name: 上传构建与诊断文件
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AudioRelayLab-iOS-Build
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
          path: |
            dist/AudioRelayLab-unsigned.ipa
            dist/ipa-manifest.json
            dist/build-evidence.json
            dist/SHA256SUMS.txt
            AudioRelayLab.xcodeproj/
            build-*.log
            build-simulators.json
            build/*.xcresult/
            build/ui-*.png
            BUILD-STATUS-ZH.txt
            README-BUILD-ZH.txt
            README-INSTALL-ZH.txt
            TEST-PROTOCOL-ZH.txt
            VOICE-PROCESSING-RESEARCH-ZH.md
            VOICE-LAB-TEST-PROTOCOL-ZH.md
            AI-VOICE-GUIDE-ZH.md
            REVOICE-1.6-ZH.md
            MODAL-DEPLOYMENT-ZH.md
            REVOICE-1.6.1-ZH.md
            REVOICE-1.6.2-ZH.md
            REVOICE-1.6.3-ZH.md
            REVOICE-1.6.4-ZH.md
            REVOICE-1.6.5-ZH.md
            REVOICE-1.6.6-ZH.md
            build/revoice-download-fixture-report.json
            build/revoice-fixture-readiness.log
            build/ui-*.mp4
            build/ui-attachments/
            build/ui-small-attachments/
      - name: 记录最终状态
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          {
            echo '### 音频接力实验室'
            echo "任务状态：$BUILD_STATUS"
            echo "源码提交：$AUDIOLAB_SOURCE_COMMIT"
            if [ -f dist/AudioRelayLab-unsigned.ipa ]; then
              echo '真实产物：AudioRelayLab-unsigned.ipa；仅供用户自行重新签名安装。'
              shasum -a 256 dist/AudioRelayLab-unsigned.ipa
            else
              echo '本轮未生成 unsigned IPA，请检查日志 Artifact。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  automatic-instruction-diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.diagnosticOnly == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      AUDIOLAB_SIMULATOR_OS: '18.5'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 生成诊断工程
        run: |
          set -euo pipefail
          mkdir -p build
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 scripts/generate-audio-fixtures.py
          xcodegen generate
          xcodebuild -version
          git rev-parse HEAD
      - name: 仅验证所选 UI 操作（不生成 IPA）
        env:
          DIAGNOSTIC_SCOPE: ${{ inputs.diagnosticScope || 'automatic' }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > build/simulators.json
          SIMULATOR_UDID="$(python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          devices=json.loads(Path('build/simulators.json').read_text())['devices']
          for runtime in sorted(devices,key=lambda key:tuple(map(int,re.findall(r'\d+',key))),reverse=True):
              if not runtime.endswith('.iOS-'+os.environ['AUDIOLAB_SIMULATOR_OS'].replace('.','-')):
                  continue
              for device in devices[runtime]:
                  if device.get('isAvailable') and device.get('name','').startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone Simulator')
          PY
          )"
          UI_CASE=AudioRelayLabUITests/InteractionUITests/testAutomaticInstructionTogglePreviewAndFixedReferenceAvailability
          if [ "$DIAGNOSTIC_SCOPE" = small ]; then
            SMALL_RUNTIME="$(python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          devices=json.loads(Path('build/simulators.json').read_text())['devices']
          print(next(key for key in devices if key.endswith('.iOS-'+os.environ['AUDIOLAB_SIMULATOR_OS'].replace('.','-'))))
          PY
            )"
            SIMULATOR_UDID="$(xcrun simctl create AudioRelayLab-SmallDiagnostic com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$SMALL_RUNTIME")"
            UI_CASE=AudioRelayLabUITests/InteractionUITests/testSelectedMusicTimingScreenshotsAcrossThemesAndLargeType
            xcrun simctl boot "$SIMULATOR_UDID"
          elif python3 - "$SIMULATOR_UDID" <<'PY'
          import json,sys
          devices=json.load(open('build/simulators.json'))['devices']
          sys.exit(0 if any(d['udid']==sys.argv[1] and d['state']=='Booted' for group in devices.values() for d in group) else 1)
          PY
          then :; else xcrun simctl boot "$SIMULATOR_UDID"; fi
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          if [ "$DIAGNOSTIC_SCOPE" = single-delete ]; then
            UI_CASE=AudioRelayLabUITests/InteractionUITests/testSingleDeletionShowsSameFileAfterCancelAndReopen
          fi
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 build/ui-automatic.mp4 > build/recording.log 2>&1 &
          RECORD_PID=$!
          trap 'kill -INT "$RECORD_PID" 2>/dev/null || true; wait "$RECORD_PID" || true' EXIT
          xcodebuild -project AudioRelayLab.xcodeproj -scheme AudioRelayLab \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID,arch=$(uname -m)" \
            -destination-timeout 180 -parallel-testing-enabled NO \
            -derivedDataPath build/ui-diagnostic -resultBundlePath build/automatic.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test -only-testing:"$UI_CASE" \
            2>&1 | tee build-automatic-ui.log
      - name: 导出单项 UI 截图
        if: always()
        run: |
          set -euo pipefail
          if [ -f build/automatic.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/automatic.xcresult --output-path build/ui-diagnostic-attachments
          fi
      - name: 上传单项诊断证据
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AudioRelayLab-Automatic-UI-Diagnostic
          retention-days: 7
          path: |
            build-automatic-ui.log
            build/automatic.xcresult/
            build/ui-automatic.mp4
            build/recording.log
            build/ui-diagnostic-attachments/
