name: iOS 无签名构建
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      AUDIOLAB_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 读取源码
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.AUDIOLAB_SOURCE_COMMIT }}
      - name: 记录真实构建环境
        run: |
          set -euo pipefail
          mkdir -p build dist
          {
            sw_vers
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            swift --version
            xcode-select -p
            xcrun simctl list runtimes
            printf '源码提交：%s\n' "$(git rev-parse HEAD)"
          } 2>&1 | tee build-environment.log
      - name: 配置 Python 3.12 与 CPU 测试依赖
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 安装锁定的 CPU 测试依赖
        run: python3 -m pip install -r server/ci-requirements.txt 2>&1 | tee build-python-dependencies.log
      - name: 安装 XcodeGen 并静态检查
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version 2>&1 | tee build-xcodegen-version.log
          python3 scripts/static_check.py 2>&1 | tee build-static.log
          python3 -m unittest discover -s tests -v 2>&1 | tee build-tests.log
      - name: 生成 Xcode 工程
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 scripts/generate-audio-fixtures.py 2>&1 | tee build-audio-fixtures.log
          xcodegen generate 2>&1 | tee build-xcodegen.log
          xcodebuild -project AudioRelayLab.xcodeproj -list 2>&1 | tee build-project-list.log
      - name: 编译模拟器
        run: |
          set -euo pipefail
          xcodebuild \
            -project AudioRelayLab.xcodeproj -scheme AudioRelayLab \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            -resultBundlePath build/simulator.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-simulator.log
      - name: 在真实 iPhone Simulator 中运行 XCTest
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > build-simulators.json
          SIMULATOR_UDID="$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          devices = json.loads(Path('build-simulators.json').read_text())['devices']
          runtimes = sorted(devices, key=lambda name: tuple(map(int, re.findall(r'\d+', name))), reverse=True)
          for runtime in runtimes:
              if '.iOS-' not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get('isAvailable') and device.get('name', '').startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('没有可用的 iPhone Simulator，不能宣称 XCTest 通过。')
          PY
          )"
          SIMULATOR_ARCH="$(uname -m)"
          # Grant only the test app's microphone permission on this disposable simulator.
          if python3 - "$SIMULATOR_UDID" <<'PY'
          import json,sys
          devices=json.load(open('build-simulators.json'))['devices']
          sys.exit(0 if any(d['udid']==sys.argv[1] and d['state']=='Booted' for group in devices.values() for d in group) else 1)
          PY
          then :; else xcrun simctl boot "$SIMULATOR_UDID"; fi
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" build/simulator/Build/Products/Debug-iphonesimulator/AudioRelayLab.app
          xcrun simctl privacy "$SIMULATOR_UDID" grant microphone com.audiorelaylab.AudioRelayLab
          # Native URLSession tests use trusted loopback HTTPS, never the live GPU or production credentials.
          cat > build/revoice-fixture-openssl.cnf <<'CONF'
          [req]
          distinguished_name = subject
          x509_extensions = extensions
          prompt = no
          [subject]
          CN = AudioRelayLab disposable CI fixture
          [extensions]
          basicConstraints = critical,CA:TRUE
          keyUsage = critical,digitalSignature,keyEncipherment,keyCertSign
          extendedKeyUsage = serverAuth
          subjectAltName = @names
          [names]
          IP.1 = 127.0.0.1
          DNS.1 = localhost
          CONF
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -config build/revoice-fixture-openssl.cnf -keyout build/revoice-fixture.key \
            -out build/revoice-fixture.crt 2> build/revoice-fixture-certificate.log
          xcrun simctl keychain "$SIMULATOR_UDID" add-root-cert build/revoice-fixture.crt
          python3 -u scripts/run-revoice-download-fixture.py --certificate build/revoice-fixture.crt \
            --private-key build/revoice-fixture.key --report build/revoice-download-fixture-report.json \
            > build-revoice-network.log 2>&1 &
          DOWNLOAD_FIXTURE_PID=$!
          cleanup_download_fixture() {
            kill -TERM "$DOWNLOAD_FIXTURE_PID" 2>/dev/null || true
            wait "$DOWNLOAD_FIXTURE_PID" || true
          }
          trap cleanup_download_fixture EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            --cacert build/revoice-fixture.crt https://127.0.0.1:8765/ready
          # Capture real, rendered SwiftUI pages from the installed app, before tests change its library.
          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-audio.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab voice-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-voice.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab voice-custom-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-voice-custom.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab night-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-audio-dark.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab voice-custom-snapshot night-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-voice-custom-dark.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab voice-custom-snapshot voice-large-type day-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-voice-custom-large.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab voice-custom-snapshot voice-large-type night-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-voice-custom-large-dark.png
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab voice-custom-snapshot voice-recovery-snapshot
          sleep 3
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ui-voice-recovery.png
          xcrun simctl terminate "$SIMULATOR_UDID" com.audiorelaylab.AudioRelayLab
          printf 'XCTest iPhone Simulator UDID: %s; architecture: %s\n' "$SIMULATOR_UDID" "$SIMULATOR_ARCH" | tee build-test-destination.log
          xcodebuild \
            -project AudioRelayLab.xcodeproj -scheme AudioRelayLab \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID,arch=$SIMULATOR_ARCH" \
            -destination-timeout 180 -parallel-testing-enabled NO \
            -derivedDataPath build/simulator-tests \
            -resultBundlePath build/unit-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test -only-testing:AudioRelayLabTests 2>&1 | tee build-xctest.log
          # Record actual selection scrolling while the same parent updates four times per second.
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 build/ui-interaction.mp4 > build-ui-recording.log 2>&1 &
          RECORD_PID=$!
          trap 'kill -INT "$RECORD_PID" 2>/dev/null || true; cleanup_download_fixture' EXIT
          xcodebuild \
            -project AudioRelayLab.xcodeproj -scheme AudioRelayLab \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID,arch=$SIMULATOR_ARCH" \
            -destination-timeout 180 -parallel-testing-enabled NO \
            -derivedDataPath build/simulator-tests -resultBundlePath build/ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test -only-testing:AudioRelayLabUITests 2>&1 | tee build-uitest.log
          kill -INT "$RECORD_PID" 2>/dev/null || true
          wait "$RECORD_PID" || true
          cleanup_download_fixture
          trap - EXIT
      - name: 编译 iPhoneOS Release
        run: |
          set -euo pipefail
          xcodebuild \
            -project AudioRelayLab.xcodeproj -scheme AudioRelayLab \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            -resultBundlePath build/device.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-device.log
      - name: 验证真机产物并打包 unsigned IPA
        run: |
          set -euo pipefail
          bash scripts/package-ipa.sh 2>&1 | tee build-package.log
          shasum -a 256 dist/AudioRelayLab-unsigned.ipa | tee dist/SHA256SUMS.txt
      - name: 核对真实构建证据并更新 Artifact 状态报告
        run: |
          set -euo pipefail
          python3 scripts/record-ci-result.py 2>&1 | tee build-evidence.log
      - name: 上传构建与诊断文件
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AudioRelayLab-iOS-Build
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/AudioRelayLab-unsigned.ipa
            dist/ipa-manifest.json
            dist/build-evidence.json
            dist/SHA256SUMS.txt
            AudioRelayLab.xcodeproj/
            build-*.log
            build-simulators.json
            build/*.xcresult/
            build/ui-*.png
            BUILD-STATUS-ZH.txt
            README-BUILD-ZH.txt
            README-INSTALL-ZH.txt
            TEST-PROTOCOL-ZH.txt
            VOICE-PROCESSING-RESEARCH-ZH.md
            VOICE-LAB-TEST-PROTOCOL-ZH.md
            AI-VOICE-GUIDE-ZH.md
            REVOICE-1.6-ZH.md
            MODAL-DEPLOYMENT-ZH.md
            REVOICE-1.6.1-ZH.md
            REVOICE-1.6.2-ZH.md
            build/revoice-download-fixture-report.json
            build/ui-*.mp4
      - name: 记录最终状态
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          {
            echo '### 音频接力实验室'
            echo "任务状态：$BUILD_STATUS"
            echo "源码提交：$AUDIOLAB_SOURCE_COMMIT"
            if [ -f dist/AudioRelayLab-unsigned.ipa ]; then
              echo '真实产物：AudioRelayLab-unsigned.ipa；仅供用户自行重新签名安装。'
              shasum -a 256 dist/AudioRelayLab-unsigned.ipa
            else
              echo '本轮未生成 unsigned IPA，请检查日志 Artifact。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
